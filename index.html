<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Словарь устаревших слов (более 1000)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #2c1e16;
            background-image: radial-gradient(ellipse at 30% 40%, #4a3426 0%, #1f150e 100%);
            min-height: 100vh;
            color: #e6dccb;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(38, 28, 20, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 30px 30px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 215, 140, 0.15);
            border: 1px solid rgba(200, 160, 120, 0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(200, 160, 120, 0.2);
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #eedbca;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .logo span {
            display: block;
            font-size: 12px;
            color: #b8a38f;
            letter-spacing: 4px;
            margin-top: 2px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            margin-bottom: 28px;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 60px;
            border: 1px solid rgba(200, 160, 120, 0.1);
        }
        .controls .search-wrap {
            flex: 1 1 220px;
            position: relative;
        }
        .controls .search-wrap input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(200, 160, 120, 0.25);
            background: rgba(20, 14, 10, 0.7);
            color: #e6dccb;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .controls .search-wrap input:focus {
            border-color: #c9a87c;
            background: rgba(30, 20, 16, 0.8);
        }
        .controls .search-wrap input::placeholder {
            color: #8a7a6a;
        }
        .controls .search-wrap .autocomplete {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #2a1e16;
            border: 1px solid rgba(200, 160, 120, 0.2);
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 20;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }
        .controls .search-wrap .autocomplete div {
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(200, 160, 120, 0.05);
        }
        .controls .search-wrap .autocomplete div:hover {
            background: rgba(200, 160, 120, 0.15);
        }
        .controls .filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .controls .filters .filter-btn {
            background: transparent;
            border: 1px solid rgba(200, 160, 120, 0.15);
            color: #b8a38f;
            padding: 6px 16px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .filters .filter-btn.active {
            background: #c9a87c;
            border-color: #c9a87c;
            color: #1f150e;
        }
        .controls .filters .filter-btn:hover {
            background: rgba(200, 160, 120, 0.15);
            color: #eedbca;
        }
        .controls .sort-select {
            background: rgba(20, 14, 10, 0.7);
            border: 1px solid rgba(200, 160, 120, 0.2);
            color: #dccdbd;
            padding: 6px 14px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .word-card {
            background: rgba(30, 22, 16, 0.7);
            border-radius: 20px;
            padding: 18px 20px 16px;
            border: 1px solid rgba(200, 160, 120, 0.12);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: default;
            backdrop-filter: blur(2px);
            position: relative;
            overflow: hidden;
        }
        .word-card::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(200, 160, 120, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        .word-card:hover {
            border-color: #c9a87c;
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .word-card .word-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .word-card .word-title {
            font-size: 22px;
            font-weight: 700;
            color: #eedbca;
            letter-spacing: 0.5px;
        }
        .word-card .word-category {
            font-size: 11px;
            color: #b8a38f;
            background: rgba(200, 160, 120, 0.1);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid rgba(200, 160, 120, 0.1);
        }
        .word-card .word-meaning {
            font-size: 15px;
            color: #dccdbd;
            margin: 6px 0 10px;
            line-height: 1.5;
            font-style: italic;
        }
        .word-card .word-example {
            font-size: 13px;
            color: #b8a38f;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 2px solid rgba(200, 160, 120, 0.2);
        }
        .word-card .word-origin {
            font-size: 12px;
            color: #8a7a6a;
            margin-bottom: 6px;
        }
        .word-card .word-origin span {
            color: #c9a87c;
        }
        .word-card .word-date {
            font-size: 11px;
            color: #6a5a4a;
            margin-top: 4px;
            text-align: right;
        }
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 40px;
            padding: 12px 0 4px;
            color: #8a7a6a;
            font-size: 13px;
            border-top: 1px solid rgba(200, 160, 120, 0.08);
            margin-top: 8px;
        }
        .stats-bar span strong {
            color: #dccdbd;
            font-weight: 400;
        }
        @media (max-width: 700px) {
            .container { padding: 16px; }
            .logo h1 { font-size: 22px; }
            .controls { border-radius: 24px; padding: 12px 14px; flex-direction: column; align-items: stretch; }
            .controls .search-wrap { flex: 1 1 auto; }
            .word-grid { grid-template-columns: 1fr; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #5a4a3a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #7a6a5a; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8a7a6a;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .empty-state span {
            display: block;
            font-size: 14px;
            margin-top: 8px;
            color: #6a5a4a;
        }
    </style>
</head>

            // === ТОРГОВЛЯ (20) ===
            { id: 2310, word: 'Торг', meaning: 'Рынок', category: 'торговля' },
            { id: 2311, word: 'Лавка', meaning: 'Торговая палатка', category: 'торговля' },
            { id: 2312, word: 'Товар', meaning: 'Продукт', category: 'торговля' },
            { id: 2313, word: 'Купец', meaning: 'Торговец', category: 'торговля' },
            { id: 2314, word: 'Торговля', meaning: 'Обмен товарами', category: 'торговля' },
            { id: 2315, word: 'Барышник', meaning: 'Мелкий торговец', category: 'торговля' },
            { id: 2316, word: 'Меняла', meaning: 'Обменщик денег', category: 'торговля' },
            { id: 2317, word: 'Рынок', meaning: 'Место торговли', category: 'торговля' },
            { id: 2318, word: 'Ярмарка', meaning: 'Крупный рынок', category: 'торговля' },

            { id: 2324, word: 'Лот', meaning: 'Мера веса', category: 'торговля' },
            { id: 2325, word: 'Берковец', meaning: 'Мера веса', category: 'торговля' },
            { id: 2326, word: 'Четверть', meaning: 'Мера объёма', category: 'торговля' },
            { id: 2327, word: 'Гарнец', meaning: 'Мера объёма', category: 'торговля' },
            { id: 2328, word: 'Ведро', meaning: 'Мера объёма', category: 'торговля' },
            { id: 2329, word: 'Кружка', meaning: 'Мера объёма', category: 'торговля' },
        ];

        // =============================================
        // УПРАВЛЕНИЕ СОСТОЯНИЕМ
        // =============================================
        let words = [];
        let currentFilter = 'all';
        let currentSort = 'alphabet';
        let searchQuery = '';

        const grid = document.getElementById('wordGrid');
        const searchInput = document.getElementById('searchInput');
        const autocompleteList = document.getElementById('autocompleteList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const sortSelect = document.getElementById('sortSelect');
        const totalWordsSpan = document.getElementById('totalWords');

        function loadData() {
            // Удаляем дубликаты по id
            const unique = {};
            DEFAULT_WORDS.forEach(w => { unique[w.id] = w; });
            words = Object.values(unique);
            // Добавляем поле date для сортировки (если нет)
            words.forEach(w => { if (!w.date) w.date = '2020-01-01'; });
        }

        function render() {
            let filtered = words.filter(w => {
                if (currentFilter !== 'all' && w.category !== currentFilter) return false;
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    return w.word.toLowerCase().includes(q) ||
                           w.meaning.toLowerCase().includes(q) ||
                           (w.example && w.example.toLowerCase().includes(q)) ||
                           (w.origin && w.origin.toLowerCase().includes(q));
                }
                return true;
            });

            if (currentSort === 'alphabet') {
                filtered.sort((a, b) => a.word.localeCompare(b.word));
            } else if (currentSort === 'date') {
                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">Слов не найдено<span>Попробуйте изменить запрос</span></div>`;
            } else {
                grid.innerHTML = filtered.map(w => `
                    <div class="word-card" data-id="${w.id}">
                        <div class="word-header">
                            <span class="word-title">${w.word}</span>
                            <span class="word-category">${w.category}</span>
                        </div>
                        <div class="word-meaning">${w.meaning}</div>
                        ${w.example ? `<div class="word-example">${w.example}</div>` : ''}
                        <div class="word-origin">Происхождение: <span>${w.origin || 'неизвестно'}</span></div>
                    </div>
                `).join('');
            }

            totalWordsSpan.textContent = words.length;
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            render();
            updateAutocomplete(searchQuery);
        });

        function updateAutocomplete(query) {
            if (!query) {
                autocompleteList.style.display = 'none';
                return;
            }
            const q = query.toLowerCase();
            const suggestions = words
                .filter(w => w.word.toLowerCase().startsWith(q))
                .slice(0, 6);
            if (suggestions.length === 0) {
                autocompleteList.style.display = 'none';
                return;
            }
            autocompleteList.innerHTML = suggestions.map(w =>
                `<div data-word="${w.word}">${w.word}</div>`
            ).join('');
            autocompleteList.style.display = 'block';
            autocompleteList.querySelectorAll('div').forEach(el => {
                el.addEventListener('click', () => {
                    searchInput.value = el.dataset.word;
                    searchQuery = el.dataset.word;
                    autocompleteList.style.display = 'none';
                    render();
                });
            });
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrap')) {
                autocompleteList.style.display = 'none';
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            render();
        });

        loadData();
        render();
        console.log('Словарь загружен, слов: ' + words.length);
    </script>
</body>
